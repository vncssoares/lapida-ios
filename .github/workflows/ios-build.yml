name: Build Lapida iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compilar IPA com XcodeGen (Unsigned / Ad-Hoc)
    runs-on: macos-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Gerar Projeto Xcode Nativo (project.pbxproj)
        run: |
          xcodegen generate
          ls -la Lapida.xcodeproj

      - name: Compilar Projeto com xcodebuild (Sem Assinatura Paga)
        run: |
          xcodebuild build \
            -project Lapida.xcodeproj \
            -scheme LapidaApp \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=build/derivedData/Build/Products/Release-iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Empacotar .ipa (Payload canônico para AltStore / Sideloadly)
        run: |
          mkdir -p build/ipa/Payload
          
          # Localiza a pasta .app compilada
          APP_PATH=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 -type d | head -n 1)
          echo "Aplicativo compilado em: $APP_PATH"
          
          # Copia a pasta .app para dentro de Payload/
          cp -R "$APP_PATH" build/ipa/Payload/
          
          # Compacta em formato .ipa
          cd build/ipa
          zip -r -y Lapida.ipa Payload
          cd ../..
          
          echo "Arquivo IPA gerado com sucesso:"
          ls -la build/ipa/Lapida.ipa

      - name: Disponibilizar IPA nos Artefatos do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Lapida-iOS-v1.0-IPA
          path: build/ipa/Lapida.ipa
          retention-days: 30
